name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop existing container
        run: |
          docker stop my-app || true
          docker rm my-app || true

      - name: Build Docker Image
        run: |
          docker build -t my-app:latest .

      - name: Run Container
        run: |
          docker run -d \
          -p 8000:8000 \
          --name my-app \
          my-app:latest
